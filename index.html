<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Świat jest piękny</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --niebo-noc: #1d2b4f;
      --niebo-swit: #6d5a8c;
      --brzask: #f0a98a;
      --tekst: #fff8f1;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
      background: linear-gradient(to bottom, var(--niebo-noc) 0%, var(--niebo-swit) 55%, var(--brzask) 100%);
      color: var(--tekst);
      font-family: "Fraunces", Georgia, serif;
    }
    .hero h1 {
      font-size: clamp(3rem, 12vw, 9rem);
      font-weight: 300;
      line-height: 1;
      animation: wschod 2.4s ease-out both;
    }
    .hero p {
      margin-top: 1.5rem;
      font-size: clamp(1rem, 2.5vw, 1.35rem);
      max-width: 32ch;
      opacity: 0.85;
      animation: wschod 2.4s ease-out 0.6s both;
    }
    @keyframes wschod {
      from { opacity: 0; transform: translateY(40px); filter: blur(6px); }
      to   { opacity: 1; transform: translateY(0); filter: blur(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .hero h1, .hero p { animation: none; }
    }
  </style>
</head>
<body>
  <section class="hero">
    <h1>Świat jest piękny</h1>
    <p>Pierwsza strona, która przeszła całą drogę: od pliku na komputerze do internetu.</p>
  </section>
</body>
</html>
