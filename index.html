<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Świat jest piękny</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin>
  <style>
    :root {
      --niebo-noc: #1d2b4f;
      --niebo-swit: #6d5a8c;
      --brzask: #f0a98a;
      --tekst: #fff8f1;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
      background: linear-gradient(to bottom, var(--niebo-noc) 0%, var(--niebo-swit) 55%, var(--brzask) 100%);
      color: var(--tekst);
      font-family: "Fraunces", Georgia, serif;
    }
    .hero h1 {
      font-size: clamp(3rem, 12vw, 9rem);
      font-weight: 300;
      line-height: 1;
      animation: wschod 2.4s ease-out both;
    }
    .hero p {
      margin-top: 1.5rem;
      font-size: clamp(1rem, 2.5vw, 1.35rem);
      max-width: 32ch;
      opacity: 0.85;
      animation: wschod 2.4s ease-out 0.6s both;
    }
    @keyframes wschod {
      from { opacity: 0; transform: translateY(40px); filter: blur(6px); }
      to   { opacity: 1; transform: translateY(0); filter: blur(0); }
    }
    .opis {
      padding: 4rem 2rem 5rem;
      display: flex;
      justify-content: center;
      background: var(--brzask);
      color: var(--niebo-noc);
      font-family: "Fraunces", Georgia, serif;
    }
    .opis p {
      max-width: 60ch;
      font-size: clamp(1.1rem, 2.5vw, 1.5rem);
      font-weight: 300;
      line-height: 1.6;
      text-align: center;
    }
    .mapa {
      padding: 4rem 1rem 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--niebo-noc);
      color: var(--tekst);
      font-family: "Fraunces", Georgia, serif;
    }
    .mapa h2 {
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 300;
      text-align: center;
    }
    .mapa .podpis-mapy {
      margin-top: 0.75rem;
      font-size: 0.9rem;
      opacity: 0.85;
      text-align: center;
    }
    .mapa .podpis-mapy a { color: var(--brzask); }
    #mapa {
      width: 100%;
      max-width: 70rem;
      height: clamp(320px, 60vh, 560px);
      margin-top: 1.5rem;
      border: 3px solid var(--brzask);
      border-radius: 1rem;
      background: var(--niebo-swit);
      overflow: hidden;
    }
    #mapa .leaflet-tile-pane { filter: saturate(0.85) sepia(0.15); }
    @media (prefers-reduced-motion: reduce) {
      .hero h1, .hero p { animation: none; }
    }
  </style>
</head>
<body>
  <section class="hero">
    <h1>Świat jest piękny</h1>
    <p>zrobione 7 pazdziernika 2026</p>
  </section>
  <section class="opis">
    <p>Ta strona będzie pokazywać najpiękniejsze miejsca na świecie. Zbierzemy tu krajobrazy: od gór i oceanów po miasta o świcie. Zaglądaj, żeby przypomnieć sobie, że świat jest piękny.</p>
  </section>
  <section class="mapa">
    <h2>Mapa świata</h2>
    <div id="mapa"></div>
    <p class="podpis-mapy">&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap contributors</a></p>
  </section>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin></script>
  <script>
    (function () {
      var mapa = L.map("mapa", {
        minZoom: 1,
        worldCopyJump: true,
        scrollWheelZoom: false,
        dragging: !L.Browser.mobile,
        tap: !L.Browser.mobile
      }).setView([20, 0], 2);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap</a> contributors"
      }).addTo(mapa);
      mapa.on("click", function () { mapa.scrollWheelZoom.enable(); });
      mapa.on("mouseout", function () { mapa.scrollWheelZoom.disable(); });
    })();
  </script>
</body>
</html>
