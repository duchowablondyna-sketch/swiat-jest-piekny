name: Sprawdzenie pull requesta

on:
  pull_request:

permissions:
  contents: read

jobs:
  html:
    name: Poprawność HTML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pobranie kodu
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Walidacja HTML
        run: npx --yes html-validate@11.16.2 index.html

  sekrety:
    name: Skan sekretów
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pobranie kodu z pełną historią
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pobranie gitleaks (przypięta wersja, sprawdzana suma SHA256)
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Skan historii gita
        run: ./gitleaks git --no-banner --redact --verbose .
